name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Tests with coverage thresholds
        run: npm run test:coverage

      - name: Validate governed eval fixtures
        run: npm run eval:dental -- --cases eval/cases --min-cases 6 --strict

      - name: Production build
        run: npm run build

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check generated Worker bindings
        run: npm run worker:types:check

      - name: Type-check Worker tests
        run: npm run worker:test:types

      - name: Test in the Workers runtime
        run: npm run worker:test

      - name: Validate staging configuration
        run: npm run worker:validate:staging

      - name: Validate Worker bundle
        run: npm run worker:dry-run && npm run worker:dry-run:production
